name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node-version:
          - 20.17.0
          - 22.13.0

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build workspace
        run: pnpm build

      - name: Build API
        run: pnpm --filter @dx-platform/api build

      - name: Build web app
        run: pnpm --filter @dx-platform/web build

      - name: Smoke-test CLI
        run: pnpm --filter neuralforge exec node dist/main.js --version

      - name: Validate CLI package contents
        run: pnpm --filter neuralforge pack --dry-run

      - name: Test suite
        run: pnpm test

      - name: Validate types
        run: pnpm check

  clean-build:
    name: clean-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Refuse a checkout that ships build output
        shell: bash
        run: |
          build_output=$(git ls-files | { grep -E '(^|/)dist/|\.tsbuildinfo$' || true; })
          if [ -n "$build_output" ]; then
            echo "build output is committed, so this build would not prove anything:"
            printf '%s\n' "$build_output"
            exit 1
          fi

      - name: Install with frozen lockfile and no lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build from sources only
        run: pnpm build

      - name: Assert every manifest entrypoint was produced
        run: node scripts/assert-dist.mjs

      - name: Typecheck the whole solution
        run: pnpm check

  dom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - name: Install isolated Chromium
        run: pnpm --filter @dx-platform/tests exec playwright-core install --with-deps chromium
      - name: Browser DOM and rendered-text regression tests
        env:
          WTAGENT_DOM_TESTS: "1"
        run: |
          export WTAGENT_CHROME_PATH="$(pnpm --filter @dx-platform/tests exec node --input-type=module -e 'import { chromium } from "playwright-core"; console.log(chromium.executablePath())')"
          pnpm --filter @dx-platform/tests test test/chatgpt-dom.test.js test/rendered-text.test.js
