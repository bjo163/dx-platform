name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node-version:
          - 20.17.0
          - 22.13.0

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build workspace
        run: pnpm build

      - name: Test suite
        run: pnpm test

      - name: Package dry run
        run: pnpm --filter wtagent pack --dry-run

  dom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - name: Install isolated Chromium
        run: pnpm --filter @wtagent/tests exec playwright-core install --with-deps chromium
      - name: Browser DOM and rendered-text regression tests
        env:
          WTAGENT_DOM_TESTS: "1"
        run: |
          export WTAGENT_CHROME_PATH="$(pnpm --filter @wtagent/tests exec node --input-type=module -e 'import { chromium } from "playwright-core"; console.log(chromium.executablePath())')"
          pnpm --filter @wtagent/tests test test/chatgpt-dom.test.js test/rendered-text.test.js
